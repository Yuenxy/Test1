<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kopi Kito - Specialist Coffee</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-light">

    <!-- Navbar -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark sticky-top">
        <div class="container">
            <a class="navbar-brand fw-bold" href="#"><i class="bi bi-cup-hot me-2"></i>Kopi Kito</a>
            <div class="ms-auto d-flex align-items-center">
                <button class="btn btn-outline-warning btn-sm fw-bold" id="btn-toggle-admin" onclick="toggleAdminMode()">
                    <i class="bi bi-shield-lock me-1"></i> Mode Admin: OFF
                </button>
            </div>
        </div>
    </nav>

    <!-- Header -->
    <div class="hero-section text-center mb-4">
        <div class="container">
            <h1 class="fw-bold">Pure Coffee & Beans Supply</h1>
            <p class="lead mb-0">Sajian kopi seduh segar & persediaan kopi bubuk kiloan berkualitas</p>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container my-4">
        <!-- Panel Tombol Tambah (Khusus Admin) -->
        <div id="admin-panel" class="d-none mb-4 text-center">
            <button class="btn btn-success fw-bold px-4" onclick="openAddModal()">
                <i class="bi bi-plus-circle me-2"></i>Tambah Menu Baru
            </button>
        </div>

        <!-- Navigation Tabs -->
        <ul class="nav nav-pills justify-content-center mb-4">
            <li class="nav-item">
                <button class="nav-link active fw-bold px-4 rounded-pill" id="coffee-tab" data-bs-toggle="tab" data-bs-target="#coffee-menu">
                    <i class="bi bi-cup-straw me-1"></i> Seduhan Kopi
                </button>
            </li>
            <li class="nav-item">
                <button class="nav-link fw-bold px-4 rounded-pill" id="bubuk-tab" data-bs-toggle="tab" data-bs-target="#bubuk">
                    <i class="bi bi-box-seam me-1"></i> Kopi Bubuk (Per Kg)
                </button>
            </li>
        </ul>

        <!-- Tab Content -->
        <div class="tab-content">
            <!-- TAB 1: MENU MINUMAN -->
            <div class="tab-pane fade show active" id="coffee-menu">
                <h4 class="category-title fw-bold"><i class="bi bi-cup me-2"></i>Kategori Americano</h4>
                <div class="row g-3 mb-5" id="container-americano"></div>

                <h4 class="category-title fw-bold"><i class="bi bi-cup-hot me-2"></i>Kategori Espresso</h4>
                <div class="row g-3" id="container-espresso"></div>
            </div>

            <!-- TAB 2: KOPI BUBUK -->
            <div class="tab-pane fade" id="bubuk">
                <div class="row g-4" id="container-bubuk"></div>
            </div>
        </div>
    </div>

    <!-- MODAL FORM TAMBAH / EDIT MENU -->
    <div class="modal fade" id="menuModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header bg-dark text-white">
                    <h5 class="modal-title fw-bold" id="modalTitle">Tambah Menu</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="menuForm">
                        <input type="hidden" id="menuId">
                        
                        <div class="mb-3">
                            <label class="form-label fw-bold">Kategori Menu</label>
                            <select class="form-select" id="menuKategori" required onchange="toggleKemasanInput()">
                                <option value="americano">Kategori Americano</option>
                                <option value="espresso">Kategori Espresso</option>
                                <option value="bubuk">Kopi Bubuk (Per Kg)</option>
                            </select>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Nama Menu / Produk</label>
                            <input type="text" class="form-input form-control" id="menuNama" required placeholder="Contoh: Americano Ice">
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Harga</label>
                            <input type="text" class="form-input form-control" id="menuHarga" required placeholder="Contoh: Rp 18.000">
                        </div>

                        <!-- Field Khusus Kopi Bubuk -->
                        <div id="field-bubuk-only" class="d-none">
                            <div class="mb-3">
                                <label class="form-label fw-bold">Kemasan</label>
                                <input type="text" class="form-control" id="menuKemasan" placeholder="Contoh: Kemasan Saset / Kiloan">
                            </div>
                            <div class="mb-3">
                                <label class="form-label fw-bold">Deskripsi Singkat</label>
                                <textarea class="form-control" id="menuDeskripsi" rows="2" placeholder="Deskripsi produk..."></textarea>
                            </div>
                        </div>

                        <div class="mb-3">
                            <label class="form-label fw-bold">Upload Gambar Produk</label>
                            <input type="file" class="form-control" id="menuGambarFile" accept="image/*" onchange="previewImage(event)">
                            <small class="text-muted">Atau pakai URL Gambar:</small>
                            <input type="text" class="form-control mt-1" id="menuGambarUrl" placeholder="https://...">
                            <img id="imagePreview" class="img-thumbnail mt-2 d-none" style="max-height: 150px;">
                        </div>

                        <div class="text-end mt-4">
                            <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Batal</button>
                            <button type="submit" class="btn btn-success fw-bold">Simpan Menu</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="data/menu.js"></script>
    <script src="js/script.js"></script>
</body>
</html>
